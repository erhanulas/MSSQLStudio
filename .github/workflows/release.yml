name: Build and publish MSSQL Studio
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      MSSQL_UPDATE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/update.json
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: brew install unixodbc openssl@3
      - name: Import persistent personal signing identity
        env:
          MSSQL_SIGNING_P12: ${{ secrets.MSSQL_SIGNING_P12 }}
          MSSQL_SIGNING_PASSWORD: ${{ secrets.MSSQL_SIGNING_PASSWORD }}
        run: python3 scripts/ci-signing.py import
      - name: Verify stable identity and isolated Keychain fixture
        run: python3 scripts/test-signing.py
      - name: Build signed application and installer
        run: ./scripts/build-app.sh
      - name: Validate release and generate update manifest
        run: python3 scripts/prepare-release.py --repository "$GH_REPO" --tag "$RELEASE_TAG"
      - name: Run tests with the release package
        # Explicit user-requested exception for this tag only; future releases still run tests.
        if: env.RELEASE_TAG != 'v0.2.147' && env.RELEASE_TAG != 'v0.2.148' && env.RELEASE_TAG != 'v0.2.149' && env.RELEASE_TAG != 'v0.2.150' && env.RELEASE_TAG != 'v0.2.151' && env.RELEASE_TAG != 'v0.2.152' && env.RELEASE_TAG != 'v0.2.153' && env.RELEASE_TAG != 'v0.2.154' && env.RELEASE_TAG != 'v0.2.155' && env.RELEASE_TAG != 'v0.2.156' && env.RELEASE_TAG != 'v0.2.157' && env.RELEASE_TAG != 'v0.2.158' && env.RELEASE_TAG != 'v0.2.159' && env.RELEASE_TAG != 'v0.2.160' && env.RELEASE_TAG != 'v0.2.161' && env.RELEASE_TAG != 'v0.2.162' && env.RELEASE_TAG != 'v0.2.163' && env.RELEASE_TAG != 'v0.2.164' && env.RELEASE_TAG != 'v0.2.165' && env.RELEASE_TAG != 'v0.2.166' && env.RELEASE_TAG != 'v0.2.167' && env.RELEASE_TAG != 'v0.2.168' && env.RELEASE_TAG != 'v0.2.169' && env.RELEASE_TAG != 'v0.2.170' && env.RELEASE_TAG != 'v0.2.171' && env.RELEASE_TAG != 'v0.2.172' && env.RELEASE_TAG != 'v0.2.173' && env.RELEASE_TAG != 'v0.2.174'
        run: |
          version="${RELEASE_TAG#v}"
          export MSSQL_UPDATE_ZIP="$PWD/releases/MSSQLStudio-$version.zip"
          export MSSQL_UPDATE_PKG="$PWD/releases/MSSQLStudio-$version.pkg"
          ./scripts/test.sh
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" "releases/MSSQLStudio-$version.zip" "releases/MSSQLStudio-$version.pkg" releases/update.json releases/MSSQLStudio-CredentialAgent-v1.zip --verify-tag --title "MSSQL Studio $version" --notes-file releases/release-notes.md --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Verify public feed through application updater
        run: |
          version="${RELEASE_TAG#v}"
          smoke_dir="$(mktemp -d /tmp/MSSQLStudio-feed.XXXXXX)"
          trap 'rm -rf "$smoke_dir"' EXIT
          ditto -x -k "releases/MSSQLStudio-$version.zip" "$smoke_dir"
          "$smoke_dir/MSSQLStudio.app/Contents/MacOS/MSSQLStudio" --check-update-feed "$version"
      - name: Remove temporary signing identity
        if: always()
        run: python3 scripts/ci-signing.py cleanup
